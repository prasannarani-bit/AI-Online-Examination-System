<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your password on the Agentic AI Exam System">
  <title>Forgot Password - Agentic AI Exam System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

  <!-- Auth Navbar -->
  <nav class="auth-nav">
    <a href="landing.html" class="auth-nav-logo">
      <div class="auth-nav-logo-icon"><i class="bi bi-mortarboard-fill"></i></div>
      <div>
        <div class="auth-nav-logo-text">Agentic AI Exam System</div>
      </div>
    </a>
    <div style="display: flex; align-items: center; gap: 16px;">
      <a href="landing.html" class="btn btn-sm btn-outline-secondary" style="font-size:13px; font-weight:600; border-radius:6px;">
        <i class="bi bi-house-door-fill me-1"></i> Back to Home
      </a>
      <div style="font-size:13px;color:#64748b;">
        Remember your password? <a href="login.html" class="auth-link">Login here</a>
      </div>
    </div>
  </nav>

  <main class="auth-main">
    <div class="auth-card">

      <!-- Step Indicator -->
      <div style="display:flex; align-items:center; justify-content:center; gap:0; margin-bottom:24px;">
        <div id="step-ind-1" style="display:flex; flex-direction:column; align-items:center; gap:4px;">
          <div style="width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#4f46e5,#7c3aed); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; box-shadow:0 4px 12px rgba(79,70,229,0.3); transition:all .3s;">1</div>
          <span style="font-size:11px; color:#4f46e5; font-weight:600;">Enter Email</span>
        </div>
        <div style="flex:1; height:2px; background:#e2e8f0; margin:0 8px; margin-bottom:16px;"></div>
        <div id="step-ind-2" style="display:flex; flex-direction:column; align-items:center; gap:4px;">
          <div id="step-ind-2-circle" style="width:36px; height:36px; border-radius:50%; background:#e2e8f0; color:#94a3b8; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; transition:all .3s;">2</div>
          <span id="step-ind-2-label" style="font-size:11px; color:#94a3b8; font-weight:600;">Reset Password</span>
        </div>
      </div>

      <!-- Header -->
      <div class="auth-card-header">
        <div class="auth-card-header-icon" id="authHeaderIcon">
          <i class="bi bi-envelope-at-fill"></i>
        </div>
        <h2 id="authTitle">Forgot Password?</h2>
        <p id="authSubtitle">Enter your email and we'll send a reset code</p>
      </div>

      <!-- Body -->
      <div class="auth-card-body">
        <div class="form-error-msg" id="alertMsg"></div>

        <!-- Step 1: Enter Email -->
        <div id="step-1">
          <div class="form-group">
            <label class="auth-label" for="email">Email Address</label>
            <div class="auth-input-wrap">
              <i class="bi bi-envelope auth-input-icon"></i>
              <input type="email" id="email" class="auth-input"
                placeholder="Enter your registered email" required autocomplete="email">
            </div>
          </div>

          <button id="sendCodeBtn" class="btn-auth" style="margin-top: 8px;">
            <i class="bi bi-envelope-at me-2"></i>Send Reset Code
          </button>
        </div>

        <!-- Step 2: Enter Code & New Password -->
        <div id="step-2" class="d-none">
          <div class="alert alert-success rounded-3 mb-4 d-flex align-items-center gap-2" style="font-size:13.5px; padding:12px 16px;">
            <i class="bi bi-check2-circle fs-5"></i>
            Reset code sent! Please check your inbox.
          </div>

          <div class="form-group">
            <label class="auth-label" for="code">Verification Code</label>
            <div class="auth-input-wrap">
              <i class="bi bi-shield-check auth-input-icon"></i>
              <input type="text" id="code" class="auth-input"
                placeholder="Enter the 6-digit code" autocomplete="one-time-code">
            </div>
          </div>

          <div class="form-group">
            <label class="auth-label" for="new_password">New Password</label>
            <div class="auth-input-wrap">
              <i class="bi bi-lock auth-input-icon"></i>
              <input type="password" id="new_password" class="auth-input"
                placeholder="Enter your new password" style="padding-right:48px">
              <button type="button" id="togglePasswordBtn" class="auth-input-btn"
                style="border-left:none;border:none;position:absolute;right:0;top:0;bottom:0;padding:0 12px;background:none;cursor:pointer;color:#64748b;">
                <i class="bi bi-eye" id="togglePasswordIcon"></i>
              </button>
            </div>
          </div>

          <button id="resetPassBtn" class="btn-auth">
            <i class="bi bi-check-circle me-2"></i>Update Password
          </button>
        </div>

        <!-- Bottom Links -->
        <div class="auth-divider" style="margin: 22px 0;">
          <span>or</span>
        </div>
        <div style="text-align:center;font-size:13.5px;color:#64748b;">
          <a href="login.html" class="auth-link"><i class="bi bi-arrow-left me-1"></i>Back to Login</a>
          &nbsp;·&nbsp;
          <a href="register.html" class="auth-link">Register New Account</a>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    const alertEl  = document.getElementById('alertMsg');
    const step1    = document.getElementById('step-1');
    const step2    = document.getElementById('step-2');
    const emailInput = document.getElementById('email');

    // Toggle password visibility
    document.getElementById('togglePasswordBtn').addEventListener('click', function () {
      const pwd  = document.getElementById('new_password');
      const icon = document.getElementById('togglePasswordIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
      } else {
        pwd.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
      }
    });

    function showStep2() {
      step1.classList.add('d-none');
      step2.classList.remove('d-none');
      // Update indicators
      document.getElementById('step-ind-2-circle').style.background = 'linear-gradient(135deg,#4f46e5,#7c3aed)';
      document.getElementById('step-ind-2-circle').style.color = '#fff';
      document.getElementById('step-ind-2-circle').style.boxShadow = '0 4px 12px rgba(79,70,229,0.3)';
      document.getElementById('step-ind-2-label').style.color = '#4f46e5';
      document.getElementById('authHeaderIcon').innerHTML = '<i class="bi bi-shield-lock-fill"></i>';
      document.getElementById('authTitle').textContent = 'Reset Your Password';
      document.getElementById('authSubtitle').textContent = 'Enter the code we sent and your new password';
    }

    document.getElementById('sendCodeBtn').addEventListener('click', async function () {
      const email = emailInput.value.trim();
      if (!email) {
        alertEl.textContent = 'Please enter your email address.';
        alertEl.className = 'form-error-msg show';
        return;
      }

      this.disabled = true;
      this.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Sending...';

      const res = await ApiClient.post('/auth/send-code', { email, purpose: 'reset' });

      if (res.ok) {
        alertEl.className = 'form-error-msg';
        showStep2();
      } else {
        alertEl.textContent = res.data.message || 'Error occurred. Please try again.';
        alertEl.className = 'form-error-msg show';
        this.disabled = false;
        this.innerHTML = '<i class="bi bi-envelope-at me-2"></i>Send Reset Code';
      }
    });

    document.getElementById('resetPassBtn').addEventListener('click', async function () {
      const code        = document.getElementById('code').value.trim();
      const new_password = document.getElementById('new_password').value;
      const email       = emailInput.value.trim();

      if (!code || !new_password) {
        alertEl.textContent = 'Please fill in both the code and new password.';
        alertEl.className = 'form-error-msg show';
        return;
      }

      this.disabled = true;
      this.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Updating...';

      const res = await ApiClient.post('/auth/reset-password', { email, code, new_password });

      if (res.ok) {
        alertEl.className = 'form-error-msg';
        alertEl.textContent = '';
        step2.innerHTML = `
          <div class="text-center py-4">
            <div style="width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg,#10b981,#059669); color:#fff; font-size:28px; display:flex; align-items:center; justify-content:center; margin:0 auto 16px;">
              <i class="bi bi-check-lg"></i>
            </div>
            <h5 class="fw-bold text-dark mb-2">Password Updated!</h5>
            <p class="text-muted mb-4" style="font-size:14px;">Your password has been successfully reset. You can now login with your new password.</p>
            <a href="login.html" class="btn-auth" style="display:inline-block; text-decoration:none;">
              <i class="bi bi-box-arrow-in-right me-2"></i>Go to Login
            </a>
          </div>`;
      } else {
        alertEl.textContent = res.data.message || 'Failed to reset password.';
        alertEl.className = 'form-error-msg show';
        this.disabled = false;
        this.innerHTML = '<i class="bi bi-check-circle me-2"></i>Update Password';
      }
    });
  </script>
</body>
</html>
