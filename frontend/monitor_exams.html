<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Live Exam Monitoring & Proctoring - Agentic AI Exam System">
    <title>Monitor Exams - Agentic AI Exam System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="dashboard-root">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar sidebar-admin">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon"><i class="bi bi-mortarboard-fill"></i></div>
      <div>
        <div class="sidebar-logo-text">Agentic AI</div>
        <div class="sidebar-logo-sub">Exam System</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="admin_dashboard.html" class="nav-item-s">
        <span class="nav-icon"><i class="bi bi-grid-1x2-fill"></i></span> Dashboard
      </a>
      <a href="manage_users.html" class="nav-item-s">
        <span class="nav-icon"><i class="bi bi-people-fill"></i></span> Users
      </a>
      <a href="admin_exams.html" class="nav-item-s">
        <span class="nav-icon"><i class="bi bi-journal-check"></i></span> Exams
      </a>
      <a href="monitor_exams.html" class="nav-item-s active" id="nav-monitor">
        <span class="nav-icon"><i class="bi bi-activity"></i></span> Monitoring
        <span class="nav-badge">Live</span>
      </a>
      <a href="admin_results.html" class="nav-item-s" id="nav-reports">
        <span class="nav-icon"><i class="bi bi-bar-chart-line-fill"></i></span> Reports
      </a>
      <a href="admin_files.html" class="nav-item-s" id="nav-files">
        <span class="nav-icon"><i class="bi bi-folder-fill"></i></span> Faculty Files
      </a>
      <a href="landing.html" class="nav-item-s">
        <span class="nav-icon"><i class="bi bi-house-door-fill"></i></span> Back to Home
      </a>
      <div class="sidebar-divider"></div>
      <button class="nav-item-s" onclick="doLogout()" style="color:rgba(200,255,220,.8)">
        <span class="nav-icon"><i class="bi bi-box-arrow-right"></i></span> Logout
      </button>
    </nav>
  </aside>

  <!-- ===== MAIN ===== -->
  <div class="main-content">

    <!-- Top Header -->
    <header class="top-header" style="position:relative;">
      <div class="header-greeting">
        <h5><i class="bi bi-activity me-2 text-danger"></i>Live Exam Monitoring</h5>
        <span>Real-time proctoring logs &amp; integrity violation alerts</span>
      </div>
      <div class="header-actions">
        <button onclick="deleteAllLogs();" class="btn btn-sm btn-outline-danger me-2" id="btn-delete-all" style="border-radius:8px; font-weight:600;">
          <i class="bi bi-trash me-1"></i> Delete All Logs
        </button>
        <button onclick="loadLogs();" class="btn btn-sm btn-primary" style="border-radius:8px; font-weight:600;">
          <i class="bi bi-arrow-clockwise me-1"></i> Refresh
        </button>
      </div>
    </header>

    <!-- Page Body -->
    <div class="page-body">

      <div id="alertMsg"></div>

      <div class="section-card mb-4">
        <div class="section-card-header d-flex justify-content-between align-items-center">
          <h6><i class="bi bi-shield-exclamation me-2 text-warning"></i>Flagged Violation Records</h6>
          <span id="logCountBadge" class="badge bg-warning text-dark rounded-pill px-3">0 Violations</span>
        </div>
        <div class="section-card-body p-4">
          <div class="row g-3" id="logsContainer">
            <div class="col-12 text-center py-4 text-muted">
              <div class="spinner-border spinner-border-sm me-2" role="status"></div>Loading proctoring logs...
            </div>
          </div>
        </div>
      </div>

    </div><!-- /page-body -->
  </div><!-- /main-content -->
</div><!-- /dashboard-root -->

<!-- Toast -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999;">
  <div id="mainToast" class="toast align-items-center text-white bg-success border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastMsg">Action completed successfully!</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
    ApiClient.checkAuth(['admin']);

    function doLogout() {
        ApiClient.clearTokens();
        window.location.href = 'login.html';
    }

    function showToast(msg, type='success') {
        const toast = document.getElementById('mainToast');
        toast.className = `toast align-items-center text-white bg-${type} border-0`;
        document.getElementById('toastMsg').textContent = msg;
        new bootstrap.Toast(toast).show();
    }

    async function loadLogs() {
        const res = await ApiClient.get('/admin/proctor_logs');
        const container = document.getElementById('logsContainer');
        if (res.ok) {
            document.getElementById('logCountBadge').textContent = `${res.data.length} Violation(s)`;
            if (res.data.length === 0) {
                container.innerHTML = `
                  <div class="col-12 text-center py-4">
                    <div class="alert alert-success border-0 shadow-sm rounded-4 d-inline-block px-4">
                      <i class="bi bi-shield-check fs-2 text-success d-block mb-1"></i>
                      <strong>No proctoring violations detected!</strong> All exams running cleanly.
                    </div>
                  </div>`;
            } else {
                container.innerHTML = res.data.map(log => `
                    <div class="col-md-6 col-lg-4">
                        <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden" style="background: linear-gradient(145deg, #ffffff 0%, #fffbfb 100%); border: 1px solid #fee2e2 !important;">
                            <div class="card-header bg-danger-subtle text-danger border-0 fw-bold d-flex justify-content-between align-items-center py-3">
                                <span><i class="bi bi-exclamation-triangle-fill me-1"></i> ${log.log_type.replace(/_/g, ' ').toUpperCase()}</span>
                                <span class="badge bg-danger rounded-pill">ID: ${log.id}</span>
                            </div>
                            <div class="card-body p-3 d-flex flex-column">
                                <div class="mb-2" style="font-size:13px;"><strong>Attempt ID:</strong> ${log.attempt_id}</div>
                                <div class="mb-2" style="font-size:13px;"><strong>Student:</strong> ${log.username}</div>
                                <div class="mb-2" style="font-size:13px;"><strong>Exam:</strong> ${log.exam_title}</div>
                                <div class="mb-3 text-muted" style="font-size:12px;"><i class="bi bi-clock me-1"></i>${ApiClient.formatDateTime(log.timestamp)}</div>
                                ${log.image_blob ? `<img src="${log.image_blob}" class="img-fluid rounded-3 border mb-3" style="max-height:160px; object-fit:cover;">` : ''}
                                <div class="mt-auto pt-2 border-top d-flex justify-content-end">
                                    <button data-log-id="${log.id}" class="btn btn-sm btn-outline-danger fw-semibold px-3 btn-del-log" style="border-radius:6px; font-size:12px;">
                                        <i class="bi bi-trash me-1"></i> Delete Log
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');

                // Attach event listeners to all delete log buttons
                container.querySelectorAll('.btn-del-log').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const logId = btn.getAttribute('data-log-id');
                        window.deleteLog(logId);
                    });
                });
            }
        } else {
            container.innerHTML = `<div class="col-12"><div class="alert alert-danger">Error loading logs: ${res.data ? res.data.message : 'Unknown error'}</div></div>`;
        }
    }

    window.deleteLog = async function(id) {
        if (!confirm('Delete this proctoring violation record?')) return;
        const res = await ApiClient.delete(`/admin/proctor_logs/${id}`);
        if (res.ok) {
            showToast('Proctoring log deleted successfully!');
            loadLogs();
        } else {
            showToast('Error: ' + (res.data ? res.data.message : 'Failed to delete'), 'danger');
        }
    };

    window.deleteAllLogs = async function() {
        if (!confirm('Delete ALL proctoring violation records?\n\nThis action cannot be undone.')) return;
        const btn = document.getElementById('btn-delete-all');
        if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Deleting...'; }
        const res = await ApiClient.delete('/admin/proctor_logs');
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="bi bi-trash me-1"></i> Delete All Logs'; }
        if (res.ok) {
            showToast('All proctoring logs deleted successfully!');
            loadLogs();
        } else {
            showToast('Error: ' + (res.data ? res.data.message : 'Failed to delete all'), 'danger');
        }
    };

    loadLogs();
    setInterval(loadLogs, 15000);
</script>
</body>
</html>
